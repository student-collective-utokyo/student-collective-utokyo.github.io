<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜OpenAI Student Collective at UTokyo</title>
<!--
  アドレスがまちがっているときに出るページ。
  どの場所から開かれても表示がくずれないように、見た目はこのファイルの中だけに書いてあります。
  リンクの行き先は、サイトのいちばん上（/）からの位置で書いてあります。
-->
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#F4F2F0;color:#14162B;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:560px;border-radius:28px;padding:48px 40px 44px;text-align:center;background:
  radial-gradient(54% 96% at 100% 0%,#BFE9D2 0,rgba(191,233,210,0) 72%),
  radial-gradient(44% 86% at 0% 100%,#F0EC9E 0,rgba(240,236,158,0) 70%),
  radial-gradient(60% 90% at 36% 0%,#CFC6EA 0,rgba(207,198,234,0) 76%),
  #EAE6F5}
.site{font-size:14px;font-weight:700;letter-spacing:.01em}
.site span{font-weight:500;margin-left:6px}
h1{font-size:30px;line-height:1.4;font-weight:700;margin-top:22px}
p.lead{font-size:15.5px;color:#3a3c4e;margin-top:12px}
p.lead span{display:inline-block}   /* 文の途中で折れないように、読点のところでだけ折り返す */
a.btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 28px;margin-top:26px;border-radius:999px;background:#14162B;color:#fff;font-size:16px;font-weight:700;text-decoration:none}
a.btn:focus-visible{outline:2px solid #14162B;outline-offset:3px}
@media (max-width:480px){main{border-radius:24px;padding:36px 22px 34px}h1{font-size:25px}}
</style>
</head>
<body>
<main>
  <p class="site">OpenAI Student Collective<span>at UTokyo</span></p>
  <h1>ページが見つかりません</h1>
  <p class="lead"><span>アドレスが変わったか、</span><span>まちがっているかもしれません。</span></p>
  <a class="btn" href="/">ホームへ戻る</a>
</main>
</body>
</html>
